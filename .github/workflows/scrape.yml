name: Collecte situation portuaire

on:
  schedule:
    - cron: "0 5,13,21 * * *"   # 06h, 14h, 22h heure d'Algérie (UTC+1)
  workflow_dispatch:            # bouton « Run workflow » pour tester à la main

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer
        run: pip install -e .

      - name: Télécharger la situation portuaire
        run: python -m corridor.ingest.port_status

      - name: Enregistrer dans le dépôt
        if: always()   # même en cas d'échec, la ligne d'erreur du manifeste est conservée
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/port_status
          if git diff --cached --quiet; then echo "Rien à enregistrer"; exit 0; fi
          git commit -m "data: situation portuaire $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
