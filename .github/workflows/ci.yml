name: CI

on:
  push:
    paths-ignore: ["data/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      # validations lourdes, exclues de `pytest -q` par addopts : la validation
      # analytique du moteur de file (200 réplications x 8 ans) tient ici
      - name: tests lents
        run: pytest -m slow -q
