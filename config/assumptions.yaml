# Hypothèses du jumeau numérique Djen Djen–Bellara
#
# Règle : chaque paramètre porte sa valeur, son unité, sa fourchette plausible,
# son statut et sa source. Statuts possibles :
#   connu     : publié par une source identifiée
#   observé   : mesuré dans nos propres données collectées
#   annoncé   : communiqué officiellement, non réalisé ou non vérifié
#   estimé    : ordre de grandeur raisonné, à affiner
#   inconnu   : aucune donnée ; valeur de travail soumise à analyse de sensibilité
#   technique : paramètre de calcul sans portée physique (pas de temps, graine)
#
# La fourchette [min, max] sert à l'analyse de sensibilité : toute conclusion
# doit rester vraie sur la fourchette, pas seulement sur la valeur centrale.

usine:
  capacite_acier:
    value: 2.2
    unit: Mt/an
    status: connu
    source: "GMK Center, Algeria's steel industry: why is it growing"
  capacite_laminage:
    value: 2.0
    unit: Mt/an
    status: connu
    source: "GMK Center (rond à béton et fil machine)"
  capacite_dri:
    value: 2.5
    unit: Mt/an
    status: connu
    source: "GMK Center (module Midrex)"
  taux_utilisation_dri:
    value: 0.85
    range: [0.70, 0.95]
    unit: fraction
    status: estimé
    note: "Hors arrêts planifiés, modélisés à part."
  arrets_planifies_dri:
    value: 20
    range: [10, 35]
    unit: jours/an
    status: estimé
    note: "Maintenance annuelle typique d'un module DRI."
  duree_arret_non_planifie_j:
    value: 7
    range: [2, 30]
    unit: jours
    status: estimé
    note: >
      Durée moyenne d'un arrêt non planifié du module DRI, en mode d'arrêts discrets
      (`simulation.mode_arrets_dri: discret`). **Valeur de travail sans source** : les
      arrêts d'un réacteur Midrex vont de quelques heures (déclenchement, compresseur) à
      plusieurs semaines (réfractaire, alimentation en gaz, campagne de montée en cadence).
      La fourchette est volontairement large. La fréquence des arrêts n'est pas un paramètre
      : elle se déduit de cette durée et de `taux_utilisation_dri`, pour que la disponibilité
      moyenne reste exactement celle de l'hypothèse.
  cv_duree_arret:
    value: 1.0
    range: [0.5, 1.5]
    unit: coefficient de variation
    status: estimé
    note: >
      Variabilité de la durée d'un arrêt non planifié (loi gamma). 1 = exponentielle. Les
      durées de **marche** entre deux arrêts suivent, elles, une loi exponentielle : une
      panne n'a pas de mémoire de la précédente.
  pellets_par_t_dri:
    value: 1.45
    range: [1.40, 1.50]
    unit: t/t
    status: estimé
    source: "Ordre de grandeur de la littérature sur le procédé Midrex"
  capacite_stock_pellets_usine:
    value: 150000
    range: [50000, 300000]
    unit: t
    status: inconnu

phase_2:
  capacite_acier_cible:
    value: 4.0
    unit: Mt/an
    status: annoncé
    source: "Presse, accord d'expansion annoncé ; à recouper"
  facteur_dri:
