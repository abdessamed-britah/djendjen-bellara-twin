couts:
  prime_lissage_affretement:
    value: 50000
    range: [5000, 300000]
    unit: USD par navire et par point de c_a² réduit
    status: estimé
    note: >
      **Valeur de travail, sans aucune source.** Ce que coûterait d'obtenir de
      l'affréteur des fenêtres d'arrivée contractuelles plus serrées : primes de laycan,
      surcoût d'un contrat d'affrètement à période plutôt qu'au coup par coup, pénalités
      de réservation de créneau. Exprimée par navire et par **point de c_a²** gagné :
      ramener c_a² de 0,83 à 0,33 sur 28 navires par an coûterait 0,5 × 28 × la valeur.
      L'ordre de grandeur est raisonné depuis `surestaries_usd_par_heure` (1 250 USD/h,
      soit 30 000 USD/jour pour un Capesize) : 50 000 USD revient à environ 1,7 jour d'affrètement par navire et par
      point, pour un armateur qui perd de la souplesse de routage. La fourchette couvre
      deux ordres de grandeur **à dessein** : la seule chose que ce paramètre sert à
      montrer, c'est **la structure** de l'arbitrage entre lissage et stockage, et surtout
      comment la position de l'optimum dépend du rapport des deux coûts — pas un montant.
      La linéarité en c_a² est elle-même une hypothèse de forme : en pratique les derniers
      points de régularité coûtent sans doute beaucoup plus cher que les premiers.
  cout_stockage_annualise:
    value: 4000
    range: [1000, 20000]
    unit: USD par kt de capacité et par an
    status: estimé
    note: >
      **Valeur de travail, sans aucune source.** Coût annualisé d'une capacité de stockage
      de pellets : amortissement du génie civil et des engins de reprise, entretien,
      surface, assurance. Pour un stockyard à ciel ouvert en vrac, l'ordre de grandeur
      raisonné est de quelques USD par tonne de capacité et par an, d'où 4 USD/t/an, soit
      4 000 USD/kt/an. La borne haute couvre le cas d'un stockage couvert ou de silos, qui
      coûte un ordre de grandeur de plus. Ce coût est supposé **proportionnel à la
      capacité**, ce qui ignore les économies d'échelle et le fait qu'une extension de
      stockyard peut buter sur l'emprise foncière disponible bien avant son coût.
  surestaries_usd_par_heure:
    value: 1250
    range: [400, 3000]
    unit: USD par heure d'attente en rade et par navire
    status: estimé
    note: >
      **Valeur de travail.** Taux de surestaries d'un minéralier de ~140 kt (petit
      Capesize) : 1 250 USD/h, soit 30 000 USD/jour. Remplace l'ancienne clé
      `navires_minerai.taux_surestaries`, qui portait la même valeur en USD/jour : une seule
      clé pour un même fait, pour que les deux ne puissent pas diverger. La fourchette est
      **élargie à dessein** à [400 ; 3 000] USD/h, soit ~10 000 à 72 000 USD/jour : c'est
      l'amplitude du marché du fret Capesize sur la dernière décennie, du creux de 2016 aux
      pointes de 2021. Le modèle l'applique à **chaque heure d'attente en rade**, de
      l'arrivée à l'accostage, sans franchise de staries ni distinction entre le temps
      contractuel et le retard — une borne haute du coût réel, que les contrats d'affrètement
      réduisent d'une franchise de quelques jours. L'immobilisation à quai faute de place au
      stockyard n'est pas comptée : elle est quasi nulle en approvisionnement endogène.
  prix_pellets:
    value: 140
    range: [100, 180]
    unit: USD/t
    status: estimé
    note: "À recaler sur la série Banque mondiale (Pink Sheet) + prime pellets."
  taux_de_portage:
    value: 0.10
    range: [0.06, 0.15]
    unit: fraction/an
    status: estimé
    note: >
      Coût annuel de détention d'une tonne de stock, en fraction de sa valeur : coût du
      capital immobilisé, assurance, pertes et manutention. Appliqué au **stock physique
      moyen** (stockyard + usine), au prix `prix_pellets`. Le minerai en mer et en rade n'est
      pas compté : qui le porte dépend de l'Incoterm du contrat (FOB : l'acheteur dès le
      chargement ; CFR/CIF : à la livraison), que rien de public ne renseigne.
  cout_journee_arret_dri:
    value: 130000
    range: [40000, 230000]
    unit: USD/jour
    status: estimé
    note: "Dérivé de marges EAF chinoises sur le rond à béton (7 à 44 USD/t), non spécifique à l'Algérie : à corriger dès qu'une donnée locale existe. Correspond à une journée de production DRI du site actuel (capacité de la baseline) ; ordre de grandeur, pas une mesure."

