    status: estimé
    note: >
      Règle d'expédition des rames. « pull » : une rame ne part charger que si le stock
      usine peut recevoir une charge complète — le tampon reste donc au port, et une
      rame n'est jamais immobilisée chargée devant une usine pleine. « push » : la rame
      part dès qu'il y a de quoi charger et attend s'il n'y a plus de place à l'usine.
      Aucune source sur la pratique réelle : « pull » est retenu par défaut parce qu'il
      correspond à une exploitation raisonnable, « push » est conservé pour comparaison.
