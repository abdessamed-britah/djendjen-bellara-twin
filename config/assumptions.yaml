# Paramètres propres à la simulation (étape 4). Les grandeurs dérivées (besoin annuel
# en pellets, navires par an, intervalle entre arrivées, débit horaire du DRI) ne
# figurent pas ici : elles sont calculées dans corridor.sim.config à partir des
# hypothèses ci-dessus.
approvisionnement:
  # Utilisé seulement quand simulation.politique_approvisionnement vaut
  # « point_de_commande ». En politique exogène, les arrivées suivent
  # simulation.dispersion_arrivees et ce bloc est ignoré.
  delai_moyen_j:
    value: 22
    range: [15, 30]
    unit: jours
    status: estimé
    note: >
      Délai entre la décision d'affréter un minéralier et son arrivée en rade de Djen
      Djen : chargement au port d'origine plus traversée. Ordre de grandeur pour des
      pellets venus du Brésil (Tubarão, ~4 000 milles nautiques) ou du Canada (Sept-Îles,
      ~3 800 milles) à 12-14 nœuds, soit ~12 à 14 jours de mer, plus l'attente d'un
      créneau de chargement et la mise à disposition du navire. **Aucune source publique
      sur les contrats d'AQS** : c'est une valeur de travail, d'où la fourchette large.
  cv_delai:
    value: 0.25
    range: [0.10, 0.60]
    unit: coefficient de variation
    status: estimé
    note: >
      Variabilité du délai d'approvisionnement, en coefficient de variation d'une loi
      gamma. Elle porte la météo en mer, l'attente au port de chargement et les aléas
      d'affrètement. **Ne pas la régler pour retrouver l'irrégularité mesurée des
      arrivées** : le c_a² des arrivées est désormais une sortie du modèle, et c'est la
      comparer à la mesure qui sert de validation. La caler dessus viderait ce test.
  point_de_commande_j:
    value: 30
    range: [15, 60]
    unit: jours de consommation
    status: estimé
    note: >
      Point de commande s de la politique (s, Q) : un navire est affrété dès que la
      position de stock — stockyard, usine, rail en transit, navires en rade (à quai
      compris, pour la cargaison encore à bord) et navires en mer — passe sous s jours
      de consommation de l'aciérie. Exprimé en jours pour être sans dimension, comme la
      couverture τ des autres résultats. Il doit couvrir le délai d'approvisionnement,
      faute de quoi la rupture est programmée à chaque cycle.

simulation:
  jours_par_an:
    value: 365
    unit: jours
    status: connu
  dispersion_arrivees:
    value: 0.0
    range: [0.0, 1.5]
    unit: coefficient de variation
    status: estimé
    note: >
      Régularité des arrivées de minéraliers. 0 = arrivées parfaitement régulières
      (cas de référence), 1 = processus de Poisson, au-delà = arrivées groupées.
      Le baseline est volontairement régulier : c'est le cas de référence qui isole
      la capacité du corridor de l'irrégularité de l'affrètement.
      **Cette valeur de 0 est un choix de cas de référence, pas une mesure.** Pour la
      valeur estimée sur des données réelles, voir `dispersion_arrivees_observee`
      ci-dessous : 0,91, soit presque le régime de Poisson. Elle n'est pas recopiée ici
      pour ne pas transformer en silence le scénario `baseline` — qui n'aurait alors plus
      de cas de référence régulier — et parce que toute la grille de sensibilité ainsi
      que la frontière de service balaient déjà cet axe.
      La série de situations portuaires, elle, ne contient que 4 arrivées de minéraliers,
      donc 2 intervalles (1,6 jour, puis 25,1 jours) : trop peu pour estimer quoi que ce
      soit, mais le schéma va dans le même sens.
  dispersion_arrivees_observee:
    value: 0.91
    range: [0.45, 1.31]
    unit: coefficient de variation
    status: estimé
    source: >
      Bilans « Trafic Marchandises Débarquées par catégorie de produit » publiés par
      l'Entreprise portuaire de Djen Djen, exercices 2022 à 2025, 13 pages archivées dans
      data/raw/port_stats/ (https://djendjen-port.dz). Calcul :
      scripts/arrival_dispersion.py.
    note: >
      Première estimation chiffrée de l'irrégularité des arrivées de minéraliers, au
      2026-10-24. **Méthode** : les bilans publient le tonnage de la ligne « Pellets »
      (« Pellets / DRI » à partir de 2024) en cumul depuis le 1er janvier, par trimestre,
      semestre, fin septembre et année. Différencier les cumuls donne 16 trimestres isolés
      de 2022 à 2025 ; chaque cumul étant publié sur deux pages, la lecture est recoupée
      et aucune contradiction n'a été trouvée. Le nombre de navires d'un trimestre est
      estimé par tonnage ÷ `navires_minerai.taille_moyenne`. L'indice de dispersion des
      comptages I = Var(N)/E[N] vaut 0,83, IC 95 % par bootstrap [0,21 ; 1,73] ; pour un
      processus de renouvellement il tend vers c_a², d'où la valeur ci-dessus par racine
      carrée (0,91, fourchette [0,45 ; 1,31]).
      **Quatre réserves, toutes dans la sortie du script.** (1) La consommation de
      l'aciérie varie aussi : I attribue aux arrivées toute la variance, donc il
      surestime probablement c_a². (2) 16 trimestres font une petite série, d'où un
      intervalle large. (3) Une fenêtre trimestrielle lisse les rafales de quelques jours
      que la simulation voit : de ce côté I sous-estime. (4) Le nombre de navires est un
      tonnage divisé par une taille moyenne, pas un comptage.
      **Un trimestre pèse lourd** : 2022 T3 ne porte que 606 t de pellets, soit un
      quasi-arrêt. En l'écartant, I tombe à 0,45 [0,15 ; 0,77], soit c_a² deux fois plus
      faible. Il n'est pas écarté du résultat publié — rien ne dit que ce soit une erreur
      de la source plutôt qu'un arrêt réel de l'aciérie, et l'écart entre les deux
      valeurs mesure à lui seul la fragilité de l'estimation.
  politique_approvisionnement:
    value: exogene
    unit: exogene | point_de_commande
    status: technique
    note: >
      Origine des arrivées de minéraliers. « exogene » : elles suivent un processus de
      renouvellement dont le débit moyen égale exactement la demande et dont la
      régularité est `dispersion_arrivees` — c'est le modèle historique du projet, gardé
      parce que la validation contre Pollaczek-Khinchine exige des arrivées de Poisson
      exogènes. **Il n'a pas de régime stationnaire** : l'écart offre − demande y est une
      marche aléatoire sans dérive (scripts/convergence_horizon.py). « point_de_commande » :
      un navire est affrété quand la position de stock passe sous le point de commande
      (bloc `approvisionnement`). La rétroaction rend au système une dérive de rappel.
  mode_arrets_dri:
    value: continu
    unit: continu | discret
    status: technique
    note: >
      Comment le four perd les 1 − `taux_utilisation_dri` de ses heures ouvrées.
      « continu » (historique) : il tourne en permanence à cadence réduite, capacité ×
      taux d'utilisation. « discret » : il tourne à **pleine cadence** et s'arrête par
      intermittence, arrêts non planifiés de durée `usine.duree_arret_non_planifie_j`. La
      disponibilité moyenne et donc la production moyenne sont les mêmes dans les deux
      modes ; seule change la régularité de la consommation. Verser toute la
      sous-utilisation dans des arrêts francs est l'interprétation **la plus irrégulière
      possible** : en réalité une part est de la marche à cadence réduite. Le mode discret
      donne donc une borne haute de la variabilité de la consommation.
  depassements_autorises:
    value: true
    unit: booléen
    status: estimé
    note: >
      En approvisionnement endogène, un navire commandé après un autre peut-il arriver
      avant lui ? `true` : les délais sont tirés indépendamment et les navires se doublent
      librement — réaliste pour des affrètements indépendants venus d'origines différentes
      (Brésil, Canada). `false` : chaque navire arrive au plus tôt après le précédent —
      réaliste pour une navette sur une seule route. **Cette hypothèse pèse jusqu'à 1,7 point
      de taux de service en phase 2** (limite 20 de CLAUDE.md) : toute comparaison entre
      scénarios endogènes se publie sous les deux valeurs. Sans effet en exogène.
  politique_arrets:
    value: aveugle
    unit: aveugle | rythme_moyen | date_de_reprise
    status: technique
    note: >
      Ce que la politique de commande fait pendant un arrêt du four (planifié ou non).
      « aveugle » (historique) : la position de stock ne baisse qu'aux consommations, donc
      elle se fige pendant l'arrêt et l'on cesse de commander. « rythme_moyen » : pendant
      l'arrêt, une consommation fictive au rythme moyen (`debit_pellets_t_par_h`) fait baisser
      la position vue par la politique, qui continue donc de commander ; la consommation
      fictive est effacée à la reprise. « date_de_reprise » : la durée restante R de l'arrêt
      est supposée connue ; la politique compare la position à la consommation attendue sur
      le délai moyen L, soit pleine cadence × (L − R)⁺ au lieu de rythme moyen × L, et commande
      donc à temps pour la reprise. Borne haute de l'information. Étape 7,
      scripts/politique_arrets.py.
  reporter_si_navire_en_rade:
    value: false
    unit: booléen
    status: technique
    note: >
      Option de la politique de commande : ne pas affréter tant qu'un minéralier attend en
      rade, même si la position de stock est sous le point de commande. Désactivée par
      défaut parce qu'elle fait en partie double emploi avec la politique elle-même : la
      position de stock compte déjà le navire en rade. Ce qu'elle ajoute est mesuré par
      scripts/politique_commande.py. Sans effet en exogène.
  cv_taille_navire:
    value: 0.02
    range: [0.0, 0.10]
    unit: coefficient de variation
    status: estimé
    note: "Déduit de l'étendue observée sur 5 navires (140 571 à 146 414 t)."
  cv_cadence_dechargement:
    value: 0.15
    range: [0.05, 0.35]
    unit: coefficient de variation
    status: estimé
    note: "Variabilité d'un navire à l'autre : grues, houle, qualité du produit."
  cv_durees_rail:
    value: 0.20
    range: [0.05, 0.40]
    unit: coefficient de variation
    status: estimé
    note: "S'applique aux chargements, trajets et déchargements ferroviaires."
  fraction_stock_initial:
    value: 0.5
    range: [0.0, 1.0]
    unit: fraction
    status: estimé
    note: >
      Remplissage des deux stocks au démarrage de la simulation. S'appuie sur deux
      capacités de statut inconnu : à revoir en analyse de sensibilité.
  arrets_planifies_nombre:
    value: 2
    range: [1, 4]
    unit: arrêts/an
    status: estimé
    note: >
      Les arrets_planifies_dri jours sont répartis en ce nombre d'arrêts de durée
      égale, espacés régulièrement dans l'année.
  pas_de_temps:
    value: 1.0
    unit: h
    status: technique
    note: "Pas de discrétisation du déchargement et de la consommation du DRI."
  pas_echantillonnage_stocks:
    value: 6.0
