    note: >
      Règle d'expédition des rames. « pull » : une rame ne part charger que si le stock
      usine peut recevoir une charge complète — le tampon reste donc au port, et une
      rame n'est jamais immobilisée chargée devant une usine pleine. « push » : la rame
