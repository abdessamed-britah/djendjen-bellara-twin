# Hypothèses du jumeau numérique Djen Djen–Bellara
#
# Règle : chaque paramètre porte sa valeur, son unité, sa fourchette plausible,
# son statut et sa source. Statuts possibles :
#   connu     : publié par une source identifiée
#   observé   : mesuré dans nos propres données collectées
#   annoncé   : communiqué officiellement, non réalisé ou non vérifié
#   estimé    : ordre de grandeur raisonné, à affiner
#   inconnu   : aucune donnée ; valeur de travail soumise à analyse de sensibilité
#   technique : paramètre de calcul sans portée physique (pas de temps, graine)
#
# La fourchette [min, max] sert à l'analyse de sensibilité : toute conclusion
# doit rester vraie sur la fourchette, pas seulement sur la valeur centrale.

