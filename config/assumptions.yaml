      arrondie) ; la fourchette enveloppe toutes les bornes, arrondie vers l'extérieur
      à la centaine. Calcul du 2026-10-22.
      Chaque escale donne une fourchette parce que le départ n'est jamais observé : la
      borne haute se calcule sur `departure_min` (séjour le plus court), la borne basse
      sur `departure_max`. Trois réserves : c'est une cadence **apparente** sur
      l'occupation du poste (amarrage, temps morts et attente de rames inclus, ce qui est
      bien ce que le modèle appelle cadence_dechargement) ; rien ne prouve que le tonnage
      publié ait été déchargé en entier à Djen Djen ; et 3 navires de même gabarit au même
      poste ne disent pas si la cadence serait la même sur un autre poste ou un autre
      gabarit. La dispersion inter-navires reste portée par
      `simulation.cv_cadence_dechargement`, toujours de statut estimé : les 3 centres
      mesurés sont à ± 2,5 % l'un de l'autre, bien moins dispersés que le CV de 0,15
      retenu, mais 3 observations ne suffisent pas à le resserrer.
